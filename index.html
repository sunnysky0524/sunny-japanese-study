<head>
<meta charset="utf-8">

<title>Sunny 日文語音學習站｜修正版</title>
<style>

.actions,.lesson-tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:7px;flex-wrap:wrap} .lesson-tabs{flex-wrap:nowrap}

select{border:1px solid var(--line);border-radius:14px;padding:10px;background:white;font-size:16px}

.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-bottom:16px} .panel{padding:18px} .panel h2{margin:0;color:var(--pink)} 
.lesson{display:none;padding:18px} .lesson.active{display:block} .lesson h2{color:var(--pink);font-size:clamp(24px,3vw,34px);margin:0 0 8px}

<body>
<header><div class="header-inner">
<h1>🌸 Sunny 日文語音學習站</h1>
<div class="sub">第17～36課＋50音｜單字、句子、句型、選擇題、語音｜手機和平板都可用</div>
<div class="actions">
<button id="btnLessons">📚 課程</button>
<button class="secondary" id="btnKana">🌸 50音</button>
<button class="secondary" id="btnAllQuiz">🎮 全範圍測驗</button>

<button class="secondary" id="btnWrong">📝 錯題本</button>

</div></div></header>
<main>
<section class="hero">
<div class="panel"><h2>學習方式</h2><p>每課都有句型、會話、單字與選擇題。點日文或 🔊 可播放日文語音。</p><div class="actions"><button id="btnSpeakLesson">▶ 播放本課會話</button><button class="secondary" id="btnRandom">🎲 隨機一句</button></div></div>
<div class="panel"><h2>目前課程</h2><p id="todayTip">請選一課開始。</p><div class="progress">平板橫放時會自動變成多欄版面。</div></div>
</section>
<section id="lessonsMode" class="mode active"><nav id="lessonTabs" class="lesson-tabs"></nav><div id="lessons"></div></section>
<section id="kanaMode" class="mode"><div class="panel"><h2>🌸 50音總表</h2><p>包含平假名、片假名、濁音、半濁音、拗音。點卡片可聽語音。</p><div id="kanaRoot"></div></div></section>
<section id="allQuizMode" class="mode"><div class="panel"><h2>🎮 全範圍選擇題</h2><p>混合單字與句子題。答錯會自動加入錯題本。</p><div id="allQuiz" class="quizbox"></div></div></section>
<section id="favMode" class="mode"><div class="panel"><h2>⭐ 收藏單字</h2><div id="favList" class="vocab"></div></div></section>
<section id="wrongMode" class="mode"><div class="panel"><h2>📝 錯題本</h2><div id="wrongList" class="vocab"></div></div></section>
</main>
<footer>Made for Sunny 🌸 Japanese Voice Study</footer>

}
function text(s) {
  return String(s ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;");
}
function showMode(id, doScroll=true) {
  document.querySelectorAll(".mode").forEach(e => e.classList.remove("active"));
  $(id).classList.add("active");
  if (doScroll) window.scrollTo({top:0, behavior:"smooth"});
}
function speakText(t) {
  stopSpeak();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "ja-JP";
  u.rate = parseFloat($("rate").value || "0.88");
  u.pitch = 1.03;
  speechSynthesis.speak(u);
}
function stopSpeak() { speechSynthesis.cancel(); }

function init() {
  $("btnLessons").onclick = () => showMode("lessonsMode");
  $("btnKana").onclick = () => showMode("kanaMode");
  $("btnAllQuiz").onclick = () => { showMode("allQuizMode"); startAllQuiz(); };
  $("btnFav").onclick = () => { showMode("favMode"); renderFavs(); };
  $("btnWrong").onclick = () => { showMode("wrongMode"); renderWrongs(); };
  $("btnToggleZh").onclick = toggleZh;
  $("btnStop").onclick = stopSpeak;
  $("btnSpeakLesson").onclick = speakCurrent;
  $("btnRandom").onclick = randomLine;
  renderLessonTabs();
  renderLessons();
  renderKana();
  selectLesson("L17");
}
function renderLessonTabs() {
  $("lessonTabs").innerHTML = lessons.map(l => `<button class="pill secondary" id="tab-${l.id}" data-id="${l.id}">${text(l.title.replace("｜"," "))}</button>`).join("");
  document.querySelectorAll("#lessonTabs button").forEach(btn => btn.onclick = () => selectLesson(btn.dataset.id));
}
function renderLessons() {
  $("lessons").innerHTML = lessons.map(l => `
    <section class="lesson" id="${l.id}">
      <h2>${text(l.title)}</h2>
      <div class="badges">${l.tags.map(t => `<span class="badge">${text(t)}</span>`).join("")}</div>
      <div class="section-title">📌 句型整理</div>
      <div class="grammar">${l.grammar.map(g => `<div class="card"><b class="speakable" data-text="${attr(g[0])}">${text(g[0])}</b><p>${text(g[1])}</p></div>`).join("")}</div>
      <div class="section-title">🗣️ 句子／會話</div>
      <div class="dialogue">${l.lines.map(lineHtml).join("")}</div>
      <div class="section-title">📚 單字</div>
      <div class="vocab">${l.vocab.map(vocabHtml).join("")}</div>
      <div class="section-title">📝 本課選擇題：單字＋句子</div>
      <button class="startQuiz" data-id="${l.id}">開始本課測驗</button>
      <div id="quiz-${l.id}" class="quizbox" style="display:none"></div>
    </section>
  `).join("");
  document.querySelectorAll(".speakable").forEach(el => el.onclick = () => speakText(el.dataset.text));
  document.querySelectorAll(".startQuiz").forEach(btn => btn.onclick = () => startLessonQuiz(btn.dataset.id));
  document.querySelectorAll(".speakBtn").forEach(btn => btn.onclick = () => speakText(btn.dataset.text));
  document.querySelectorAll(".favBtn").forEach(btn => btn.onclick = () => toggleFav(btn.dataset.jp, btn.dataset.kana, btn.dataset.zh, btn));
}
function lineHtml(x) {
  return `<div class="line"><div class="speaker">${text(x[0])}</div><div><div class="jp speakable" data-text="${attr(x[1])}">${text(x[1])}</div><div class="zh">${text(x[2])}</div></div><button class="secondary sound speakBtn" data-text="${attr(x[1])}">🔊</button></div>`;
}
function vocabHtml(v) {
  const key = v[0] + "|" + v[2];
  const saved = isFav(key) ? " saved" : "";
  return `<div class="card vocab-card"><div class="jpword speakable" data-text="${attr(v[0])}">${text(v[0])}</div><div class="kana">${text(v[1] || "")}</div><div class="zhword">${text(v[2])}</div><div class="mini-actions"><button class="secondary speakBtn" data-text="${attr(v[0])}">聽</button><button class="secondary star favBtn${saved}" data-jp="${attr(v[0])}" data-kana="${attr(v[1] || "")}" data-zh="${attr(v[2])}">⭐</button></div></div>`;
}
function selectLesson(id) {
  current = id;
  document.querySelectorAll(".lesson").forEach(e => e.classList.toggle("active", e.id === id));
  document.querySelectorAll("#lessonTabs button").forEach(e => e.classList.remove("active"));
  const tab = $("tab-" + id);
  if (tab) tab.classList.add("active");
  const l = lessons.find(x => x.id === id);
  $("todayTip").textContent = l ? l.title : "";
  showMode("lessonsMode", false);
}
function speakCurrent() {
  const l = lessons.find(x => x.id === current);
  if (!l) return;
  let i = 0;
  stopSpeak();
  function next() {
    if (i >= l.lines.length) return;
    const u = new SpeechSynthesisUtterance(l.lines[i++][1]);
    u.lang = "ja-JP";
    u.rate = parseFloat($("rate").value || "0.88");
    u.onend = () => setTimeout(next, 350);
    speechSynthesis.speak(u);
  }
  next();
}
function toggleZh() {
  showZh = !showZh;
  document.querySelectorAll(".zh").forEach(e => e.style.display = showZh ? "block" : "none");
}
function randomLine() {
  const all = lessons.flatMap(l => l.lines);
  const x = all[Math.floor(Math.random() * all.length)];
  speakText(x[1]);
  alert(x[1] + "\n\n" + x[2]);
}
function renderKana() {
  $("kanaRoot").innerHTML = kanaData.map(sec => `<div class="kana-section"><h3>${text(sec.title)}</h3><div class="kana-grid">${sec.items.map(k => `<div class="kana-card speakable" data-text="${attr(k[0])}"><div class="kana-main">${text(k[0])} <span class="kana-pair">${text(k[1])}</span></div><div class="kana-romaji">${text(k[2])}</div></div>`).join("")}</div></div>`).join("");
  document.querySelectorAll("#kanaRoot .speakable").forEach(el => el.onclick = () => speakText(el.dataset.text));
}
function allVocab() { return lessons.flatMap(l => l.vocab); }
function allLines() { return lessons.flatMap(l => l.lines); }
function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }
function makeOptions(answer, pool) {
  let opts = [answer];
  let clean = [...new Set(pool.filter(x => x && x !== answer))];
  while (opts.length < 4 && clean.length) opts.push(clean.splice(Math.floor(Math.random()*clean.length),1)[0]);
  return shuffle(opts);
}
function makeQuestions(l) {
  return shuffle([
    ...l.vocab.map(v => ({kind:"單字", q:v[0], a:v[2], speak:v[0], pool:l.vocab.map(x=>x[2])})),
    ...l.lines.map(x => ({kind:"句子", q:x[1], a:x[2], speak:x[1], pool:l.lines.map(y=>y[2])}))
  ]);
}
function startLessonQuiz(id) {
  const l = lessons.find(x => x.id === id);
  quizState[id] = {qs: makeQuestions(l), i:0, score:0};
  $("quiz-" + id).style.display = "block";
  renderQuiz(id);
}
function renderQuiz(id) {
  const st = quizState[id];
  const box = $("quiz-" + id);
  if (!st || st.i >= st.qs.length) {
    box.innerHTML = `<h3>完成！</h3><p>得分：${st.score}/${st.qs.length}</p><button class="startAgain">再練一次</button>`;
    box.querySelector(".startAgain").onclick = () => startLessonQuiz(id);
    return;
  }
  const q = st.qs[st.i];
  const opts = makeOptions(q.a, q.pool);
  box.innerHTML = `<div class="progress">${q.kind}題 ${st.i+1}/${st.qs.length}｜得分 ${st.score}</div><div class="bigq speakable" data-text="${attr(q.speak)}">${text(q.q)}</div><button class="secondary speakBtn" data-text="${attr(q.speak)}">🔊 聽題目</button><div class="choices">${opts.map(o => `<button class="choice" data-answer="${attr(o)}">${text(o)}</button>`).join("")}</div><div class="msg"></div>`;
  box.querySelector(".speakable").onclick = () => speakText(q.speak);
  box.querySelector(".speakBtn").onclick = () => speakText(q.speak);
  box.querySelectorAll(".choice").forEach(btn => btn.onclick = () => answerQuiz(id, btn.dataset.answer, btn));
}
function answerQuiz(id, ans, btn) {
  const st = quizState[id];
  const q = st.qs[st.i];
  document.querySelectorAll(`#quiz-${id} .choice`).forEach(b => b.disabled = true);
  const msg = $(`quiz-${id}`).querySelector(".msg");
  if (ans === q.a) {
    st.score++;
    btn.classList.add("ok");
    msg.textContent = "答對了！";
    setTimeout(() => { st.i++; renderQuiz(id); }, 650);
  } else {
    btn.classList.add("bad");
    addWrong({jp:q.q, kana:q.kind, zh:q.a});
    msg.textContent = "答錯了，正解：" + q.a + "。已加入錯題本。";
    setTimeout(() => { st.i++; renderQuiz(id); }, 1300);
  }
}
function startAllQuiz() {
  const qs = shuffle([
    ...allVocab().map(v => ({kind:"單字", q:v[0], a:v[2], speak:v[0], pool:allVocab().map(x=>x[2])})),
    ...allLines().map(x => ({kind:"句子", q:x[1], a:x[2], speak:x[1], pool:allLines().map(y=>y[2])}))
  ]).slice(0, 30);
  quizState.ALL = {qs, i:0, score:0};
  renderAllQuiz();
}
function renderAllQuiz() {
  const st = quizState.ALL;
  const box = $("allQuiz");
  if (!st || st.i >= st.qs.length) {
    box.innerHTML = `<h3>完成！</h3><p>得分：${st.score}/${st.qs.length}</p><button id="againAll">再練一次</button>`;
    $("againAll").onclick = startAllQuiz;
    return;
  }
  const q = st.qs[st.i];
  const opts = makeOptions(q.a, q.pool);
  box.innerHTML = `<div class="progress">${q.kind}題 ${st.i+1}/${st.qs.length}｜得分 ${st.score}</div><div class="bigq speakable" data-text="${attr(q.speak)}">${text(q.q)}</div><button class="secondary speakBtn" data-text="${attr(q.speak)}">🔊 聽題目</button><div class="choices">${opts.map(o => `<button class="choice" data-answer="${attr(o)}">${text(o)}</button>`).join("")}</div><div class="msg"></div>`;
  box.querySelector(".speakable").onclick = () => speakText(q.speak);
  box.querySelector(".speakBtn").onclick = () => speakText(q.speak);
  box.querySelectorAll(".choice").forEach(btn => btn.onclick = () => answerAll(btn.dataset.answer, btn));
}
function answerAll(ans, btn) {
  const st = quizState.ALL;
  const q = st.qs[st.i];
  document.querySelectorAll("#allQuiz .choice").forEach(b => b.disabled = true);
  const msg = $("allQuiz").querySelector(".msg");
  if (ans === q.a) {
    st.score++;
    btn.classList.add("ok");
    msg.textContent = "答對了！";
    setTimeout(() => { st.i++; renderAllQuiz(); }, 650);
  } else {
    btn.classList.add("bad");
    addWrong({jp:q.q, kana:q.kind, zh:q.a});
    msg.textContent = "答錯了，正解：" + q.a + "。已加入錯題本。";
    setTimeout(() => { st.i++; renderAllQuiz(); }, 1300);
  }
}
function favs() { return JSON.parse(localStorage.getItem("sunnyFavsFixed") || "[]"); }
function saveFavs(x) { localStorage.setItem("sunnyFavsFixed", JSON.stringify(x)); }
function isFav(key) { return favs().some(x => x.key === key); }
function toggleFav(jp,kana,zh,btn) {
  const key = jp + "|" + zh;
  let f = favs();
  if (isFav(key)) { f = f.filter(x => x.key !== key); btn.classList.remove("saved"); }
  else { f.push({key,jp,kana,zh}); btn.classList.add("saved"); }
  saveFavs(f);
}
function renderFavs() {
  const f = favs();
  $("favList").innerHTML = f.length ? f.map(v => vocabHtml([v.jp,v.kana,v.zh])).join("") : `<div class="empty">還沒有收藏。</div>`;
  document.querySelectorAll("#favList .speakBtn, #favList .speakable").forEach(el => el.onclick = () => speakText(el.dataset.text));
  document.querySelectorAll("#favList .favBtn").forEach(btn => btn.onclick = () => toggleFav(btn.dataset.jp, btn.dataset.kana, btn.dataset.zh, btn));
}
function wrongs() { return JSON.parse(localStorage.getItem("sunnyWrongsFixed") || "[]"); }
function saveWrongs(x) { localStorage.setItem("sunnyWrongsFixed", JSON.stringify(x)); }
function addWrong(v) { let w = wrongs(); if (!w.some(x => x.jp === v.jp)) w.push(v); saveWrongs(w); }
function renderWrongs() {
  const w = wrongs();
  $("wrongList").innerHTML = w.length ? w.map(v => vocabHtml([v.jp,v.kana,v.zh])).join("") : `<div class="empty">目前沒有錯題。</div>`;
  document.querySelectorAll("#wrongList .speakBtn, #wrongList .speakable").forEach(el => el.onclick = () => speakText(el.dataset.text));
  document.querySelectorAll("#wrongList .favBtn").forEach(btn => btn.onclick = () => toggleFav(btn.dataset.jp, btn.dataset.kana, btn.dataset.zh, btn));
}
init();
</script>
</body>
</html>
