<style>

*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Sans JP","Segoe UI",sans-serif;background:#fff;color:var(--dark);line-height:1.7}.top{position:sticky;top:0;z-index:9;background:linear-gradient(135deg,#ff8ac8,#ff4aa2);color:#fff;padding:14px 16px;box-shadow:0 2px 8px #0002}.top h1{margin:0;font-size:20px}.top p{margin:2px 0 0;font-size:13px;opacity:.95}.tabs{display:flex;gap:8px;overflow:auto;padding:10px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:78px;z-index:8}.tabs button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;color:#b0005a;font-weight:700}.tabs button.active{background:var(--pink);color:#fff}.wrap{max-width:980px;margin:0 auto;padding:16px}.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #0000000a}.section-title{color:var(--pink);font-size:22px;font-weight:900;margin:20px 0 8px}.jp{font-size:22px;font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;line-height:1.9}.kana{font-size:18px}.muted{color:#777;font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.btn{border:0;border-radius:10px;background:var(--pink);color:white;padding:10px 14px;font-weight:800;margin:4px;cursor:pointer}.btn.secondary{background:#f3f3f3;color:#444}.btn.good{background:var(--ok)}.btn.bad{background:var(--bad)}.answer{display:none;background:var(--soft);border-left:5px solid var(--pink);padding:10px 12px;border-radius:8px;margin-top:8px}.pill{display:inline-block;border:1px solid var(--line);background:var(--soft);border-radius:999px;padding:2px 8px;margin:3px;color:#b0005a}.quiz-option{display:block;width:100%;text-align:left;background:#fff;border:1px solid #ddd;border-radius:10px;padding:10px;margin:8px 0;font-size:17px}.quiz-option.correct{border-color:var(--ok);background:#ecfff4}.quiz-option.wrong{border-color:var(--bad);background:#fff1f0}.hide{display:none}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:480px}th,td{border:1px solid #eee;padding:8px;text-align:left}th{background:var(--soft);color:#b0005a}.speak{font-size:15px;padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:#fff;color:#b0005a;margin-left:6px}.small{font-size:13px}.search{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px;font-size:16px;margin:8px 0}.note{background:#fff8cc;border:1px solid #ffe58f;border-radius:12px;padding:10px;margin:10px 0}.footer{height:40px}@media(max-width:600px){.top h1{font-size:18px}.tabs{top:74px}.jp{font-size:19px}.wrap{padding:12px}.card{padding:13px}.section-title{font-size:20px}}
</style>

{q:'「請給我咖啡」的日文是？',a:'コーヒーをください。',opts:['コーヒーをください。','コーヒーがほしいです。','コーヒーにあります。']},
{q:'「廁所在哪裡？」的日文是？',a:'トイレはどこですか。',opts:['トイレはどこですか。','トイレはいくらですか。','トイレができますか。']},
{q:'「我想要錢」的日文是？',a:'わたしはお金がほしいです。',opts:['わたしはお金がほしいです。','わたしはお金をください。','わたしはお金にいます。']},
{q:'「日本是物價很高的國家」的日文是？',a:'日本は物価が高い国です。',opts:['日本は物価が高い国です。','日本は物価に高い国です。','日本は物価を高い国です。']},
{q:'「田中小姐會說韓語」的日文是？',a:'田中さんは韓国語が話せます。',opts:['田中さんは韓国語が話せます。','田中さんは韓国語をあります。','田中さんは韓国語にできます。']},
{q:'「一起去嗎？」較委婉的說法是？',a:'一緒に行きませんか。',opts:['一緒に行きませんか。','一緒に行きませんでした。','一緒に行きました。']}

function speak(t){if(!('speechSynthesis'in window))return alert('這個瀏覽器不支援語音');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.8;speechSynthesis.speak(u)}
const pages={
'首頁':()=>`<div class="card"><div class="section-title">考前使用方式</div><p>建議順序：① 50音 → ② 單字 → ③ 句型 → ④ 歷屆考題 → ⑤ 選擇題／錯題本。</p><div class="note">平板和手機都能用。日文旁邊的 🔊 可以播放語音。</div></div><div class="grid">${['50音','單字','句型','歷屆考題','選擇題','錯題本'].map(x=>`<button class="btn" onclick="go('${x}')">${x}</button>`).join('')}</div>`,
'50音':()=>kanaGroups.map(g=>`<div class="card"><div class="section-title">${g.title}</div><div class="table-wrap"><table>${g.rows.map(r=>`<tr>${r.map(c=>`<td class="jp">${c?`${c}<button class="speak" onclick="speak('${c}')">🔊</button>`:''}</td>`).join('')}</tr>`).join('')}</table></div></div>`).join(''),
'單字':()=>`<input class="search" placeholder="搜尋：中文／日文／讀音" oninput="filterVocab(this.value)"><div id="vocabList" class="grid">${vocab.map(v=>vocabCard(v)).join('')}</div>`,
'句型':()=>patterns.map(p=>`<div class="card"><div class="section-title">第${p.lesson}</div><h3>${p.title}</h3><p>${p.body}</p><button class="btn secondary" onclick="this.nextElementSibling.style.display=this.nextElementSibling.style.display==='block'?'none':'block'">複習重點</button><div class="answer">${p.body}</div></div>`).join(''),
'歷屆考題':()=>`<div class="note">已加入 108下、110下、112下重點題型：讀音、是非、日翻中、中翻日、造句。</div>${['112下','110下','108下'].map(y=>`<div class="card"><div class="section-title">${y} 歷屆考題</div>${pastQuestions.filter(q=>q.year===y).map(q=>`<p><span class="pill">${q.type}</span> ${q.q}</p><button class="btn secondary" onclick="toggleAns(this)">看答案</button><div class="answer">${q.a}</div>`).join('')}</div>`).join('')}`,
'選擇題':()=>`<div class="card"><div class="section-title">互動選擇題</div><button class="btn" onclick="startQuiz('vocab')">單字讀音測驗</button><button class="btn" onclick="startQuiz('sentence')">句子測驗</button><button class="btn" onclick="startQuiz('past')">歷屆考題隨機</button><button class="btn secondary" onclick="clearWrong()">清空錯題</button></div><div id="quizBox"></div>`,
'錯題本':()=>wrongHtml()
};
function vocabCard(v){return `<div class="card vocabItem" data-key="${v.join(' ')}"><div class="jp">${v[0]} <button class="speak" onclick="speak('${v[1]}')">🔊</button></div><b>${v[1]}</b><br><span class="muted">${v[2]}</span></div>`}
function filterVocab(s){document.querySelectorAll('.vocabItem').forEach(el=>el.style.display=el.dataset.key.includes(s)?'block':'none')}
function toggleAns(btn){let a=btn.nextElementSibling;a.style.display=a.style.display==='block'?'none':'block'}
function makeTabs(){tabs.innerHTML=Object.keys(pages).map((p,i)=>`<button onclick="go('${p}')" class="${i==0?'active':''}">${p}</button>`).join('')}
function go(p){document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.textContent===p));app.innerHTML=pages[p]();window.scrollTo(0,0)}
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function startQuiz(mode){let qs=[];if(mode==='vocab'){qs=vocab.slice(0,70).map(v=>({q:`${v[0]} 的讀音是？`,a:v[1],opts:shuffled([v[1],...shuffled(vocab).filter(x=>x[1]!=v[1]).slice(0,3).map(x=>x[1])])}))}if(mode==='sentence')qs=sentenceQuiz;if(mode==='past')qs=pastQuestions.filter(x=>x.opts.length).map(x=>({q:`${x.year}｜${x.q}`,a:x.a,opts:x.opts}));renderQuiz(shuffled(qs).slice(0,20),0,0)}
function renderQuiz(qs,i,score){if(i>=qs.length){quizBox.innerHTML=`<div class="card"><div class="section-title">完成！</div><p>分數：${score}/${qs.length}</p><button class="btn" onclick="go('錯題本')">看錯題本</button></div>`;return}let q=qs[i];quizBox.innerHTML=`<div class="card"><div class="muted">第 ${i+1}/${qs.length} 題</div><div class="section-title">${q.q}</div>${q.opts.map(o=>`<button class="quiz-option" onclick="ans(this,'${escapeHtml(o)}','${escapeHtml(q.a)}',${i},${score},${encodeURIComponent(JSON.stringify(qs))})">${o}</button>`).join('')}<button class="btn secondary" onclick="speak('${(q.a||q.q).replace(/'/g,'')}')">🔊 聽答案語音</button></div>`}
function ans(btn,o,a,i,score,enc){let qs=JSON.parse(decodeURIComponent(enc));let ok=o===a;document.querySelectorAll('.quiz-option').forEach(b=>{b.disabled=true;if(b.textContent===a)b.classList.add('correct')});if(!ok){btn.classList.add('wrong');saveWrong(qs[i])}setTimeout(()=>renderQuiz(qs,i+1,score+(ok?1:0)),900)}
function escapeHtml(s){return String(s).replace(/'/g,'&#39;')}
function saveWrong(q){let w=JSON.parse(localStorage.getItem('wrong')||'[]');w.push(q);localStorage.setItem('wrong',JSON.stringify(w.slice(-80)))}
function clearWrong(){localStorage.removeItem('wrong');alert('錯題已清空')}function wrongHtml(){let w=JSON.parse(localStorage.getItem('wrong')||'[]');return `<div class="card"><div class="section-title">錯題本</div>${w.length? w.map(x=>`<p>${x.q}</p><button class="btn secondary" onclick="toggleAns(this)">看答案</button><div class="answer">${x.a}</div>`).join(''):'目前沒有錯題。'}</div>`}
makeTabs();go('首頁');
</script>
<div class="footer"></div>
</body></html>
