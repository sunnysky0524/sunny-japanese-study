<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Sunny 日文語音學習站</title>
<style>
:root{
  --pink:#ff4fb3;--pink2:#ffe5f4;--hot:#ff7ac8;--ink:#333;--muted:#777;
  --card:#fff;--bg:#fff8fd;--line:#ffd1ea;--shadow:0 10px 28px rgba(255,79,179,.16);
}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Noto Sans JP","Hiragino Sans",sans-serif;background:linear-gradient(180deg,#fff8fd,#fff);color:var(--ink)}
header{position:sticky;top:0;z-index:10;background:rgba(255,248,253,.92);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.header-inner{max-width:1180px;margin:auto;padding:18px 18px 12px}
h1{margin:0;color:var(--pink);font-size:clamp(24px,4vw,40px);letter-spacing:.04em}
.sub{margin:6px 0 12px;color:var(--muted)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.tab{border:1px solid var(--line);background:white;border-radius:999px;padding:10px 14px;white-space:nowrap;color:#b82778;font-weight:700}
.tab.active{background:var(--pink);color:white}
main{max-width:1180px;margin:auto;padding:18px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:16px;margin-bottom:16px}
.panel,.lesson,.dialogue,.vocab-card,.quiz{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.panel{padding:18px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
button,.btn{border:0;border-radius:16px;padding:12px 14px;background:var(--pink);color:white;font-weight:800;font-size:16px}
button.secondary{background:#fff;border:1px solid var(--line);color:#c92f84}
button.ghost{background:var(--pink2);color:#b82778}
select,input{border:1px solid var(--line);border-radius:14px;padding:11px;background:white;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.lesson{padding:18px;display:none}.lesson.active{display:block}
.lesson h2{color:var(--pink);margin:0 0 6px;font-size:clamp(22px,3vw,32px)}
.badges{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 14px}.badge{background:var(--pink2);color:#b82778;border-radius:999px;padding:6px 10px;font-size:14px;font-weight:700}
.dialogue{padding:12px;margin:12px 0}
.line{display:grid;grid-template-columns:90px 1fr auto;gap:10px;align-items:center;padding:10px;border-radius:14px}
.line:hover{background:#fff4fb}.speaker{font-weight:800;color:#a02a70}.jp{font-size:clamp(20px,2.4vw,28px);line-height:1.75}.zh{color:#666;margin-top:2px}.kana{font-size:.72em;color:#999;margin-right:2px}
.section-title{font-size:22px;color:var(--pink);font-weight:900;margin:18px 0 10px}
.vocab{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.vocab-card{padding:14px;min-height:112px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center}
.vocab-card .jpword{font-size:26px;color:#333}.vocab-card .zhword{color:#777;margin-top:8px}.vocab-card button{margin-top:10px;padding:8px 10px;font-size:14px}
.practice{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.quiz{padding:14px}.quiz .answer{display:none;margin-top:10px;color:#b82778;font-weight:800}.quiz.open .answer{display:block}
footer{text-align:center;color:#999;padding:30px}
@media (max-width:820px){.hero{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.vocab{grid-template-columns:repeat(2,minmax(0,1fr))}.practice{grid-template-columns:1fr}.line{grid-template-columns:70px 1fr}.line button{grid-column:2;justify-self:start}.header-inner{padding-top:14px}}
@media (min-width:821px) and (max-width:1180px){main{padding:22px}.vocab{grid-template-columns:repeat(4,minmax(0,1fr))}.line{grid-template-columns:110px 1fr auto}.jp{font-size:30px}}

.extra-nav{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mode{display:none;background:#fff;border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px;margin-top:16px}
.mode.active{display:block}
.kana-grid{display:grid;grid-template-columns:repeat(5,minmax(58px,1fr));gap:10px}
.kana-card{background:#fff7fc;border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
.kana-main{font-size:28px;font-weight:900;color:#333}.kana-romaji{color:#b82778;font-weight:800}
.star{background:#fff;border:1px solid var(--line);color:#d12c8b}
.star.saved{background:#ffe2f3}
.stat-row{display:flex;gap:10px;flex-wrap:wrap}.stat{background:#fff4fb;border:1px solid var(--line);border-radius:16px;padding:12px;min-width:130px}
.match-options{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.choice{background:#fff;border:1px solid var(--line);color:#333}.choice.ok{background:#dff8e8}.choice.bad{background:#ffe2e2}

</style>
</head>
<body>
<header><div class="header-inner">
<h1>🌸 Sunny 日文語音學習站</h1>
<div class="sub">手機、平板、電腦都可以用。點日文句子就會播放語音。</div>
<nav class="tabs" id="tabs"></nav>
</div></header>

<main>
<section class="hero">
  <div class="panel">
    <h2 style="margin:0;color:var(--pink)">學習模式</h2>
    <p>建議先聽「慢速」，再按「跟讀模式」。iPhone / iPad 若第一次沒聲音，先點任一句播放一次即可啟用語音。</p>
    <div class="controls">
      <button onclick="speakCurrent()">▶ 播放本課全部</button>
      <button class="secondary" onclick="stopSpeak()">停止</button>
      <button class="ghost" onclick="toggleZh()">中譯開關</button>
      <label>速度 <select id="rate"><option value="0.72">慢速</option><option value="0.9" selected>正常</option><option value="1.05">稍快</option></select></label>
    </div>
    <div class="extra-nav">
      <button class="secondary" onclick="showMode('lessonsMode')">📘 課程</button>
      <button class="secondary" onclick="showMode('kanaMode')">🌸 50音</button>
      <button class="secondary" onclick="showMode('favMode');renderFavs()">⭐ 收藏</button>
      <button class="secondary" onclick="showMode('wrongMode');renderWrongs()">📝 錯題本</button>
      <button class="secondary" onclick="showMode('gameMode');newGame()">🎮 小遊戲</button>
    </div>
  </div>
  <div class="panel">
    <b>今日重點</b>
    <p id="todayTip">請選一課開始。</p>
    <div class="controls"><button class="secondary" onclick="randomLine()">🎲 隨機一句</button></div>
  </div>
</section>
<div id="lessonsMode" class="mode active"><div id="lessons" class="grid"></div></div>
<section id="kanaMode" class="mode">
  <h2 style="color:var(--pink);margin-top:0">🌸 50音練習</h2>
  <p>點假名可以播放語音。先從平假名開始，片假名之後也能再加。</p>
  <div id="kanaGrid" class="kana-grid"></div>
</section>
<section id="favMode" class="mode">
  <h2 style="color:var(--pink);margin-top:0">⭐ 收藏單字</h2>
  <div class="stat-row"><div class="stat">收藏數：<b id="favCount">0</b></div></div>
  <div id="favList" class="vocab" style="margin-top:12px"></div>
</section>
<section id="wrongMode" class="mode">
  <h2 style="color:var(--pink);margin-top:0">📝 錯題本</h2>
  <p>小遊戲答錯的題目會自動放這裡。</p>
  <div class="stat-row"><div class="stat">錯題數：<b id="wrongCount">0</b></div></div>
  <div id="wrongList" class="vocab" style="margin-top:12px"></div>
</section>
<section id="gameMode" class="mode">
  <h2 style="color:var(--pink);margin-top:0">🎮 單字小遊戲</h2>
  <div class="quiz open">
    <div>請選出中文意思：</div>
    <h3 id="gameQ" style="font-size:32px;margin:10px 0;color:#333"></h3>
    <button class="secondary" onclick="speak(document.getElementById('gameQ').textContent)">🔊 聽單字</button>
    <div id="gameOptions" class="match-options"></div>
    <div id="gameMsg" style="margin-top:10px;font-weight:900;color:#b82778"></div>
  </div>
</section>
</main>
<footer>Made for Sunny Japanese Study 🌸</footer>

let current="L34", showZh=true;
const tabs=document.getElementById("tabs"), lessonsEl=document.getElementById("lessons");
function init(){
 lessons.forEach(l=>{
   const b=document.createElement("button"); b.className="tab"; b.textContent=l.title; b.onclick=()=>selectLesson(l.id); tabs.appendChild(b);
   const sec=document.createElement("section"); sec.className="lesson"; sec.id=l.id;
   sec.innerHTML=`<h2>${l.title}</h2><div class="badges">${l.tags.map(t=>`<span class="badge">${t}</span>`).join("")}</div>
   <div class="section-title">🗣️ 對話語音</div><div class="dialogue">${l.lines.map((x,i)=>lineHtml(x,i)).join("")}</div>
   <div class="section-title">📚 單字卡</div><div class="vocab">${l.vocab.map(v=>vocabHtml(v)).join("")}</div>
   <div class="section-title">📝 小練習</div><div class="practice">${quizHtml(l)}</div>`;
   lessonsEl.appendChild(sec);
 });
 selectLesson(current);
}
function lineHtml(x,i){return `<div class="line"><div class="speaker">${x[0]}</div><div><div class="jp" onclick="speak('${esc(x[1])}')">${x[1]}</div><div class="zh">${x[2]}</div></div><button class="secondary" onclick="speak('${esc(x[1])}')">🔊</button></div>`}
function vocabHtml(v){const key=v[0]+'|'+v[2]; const saved=isFav(key)?' saved':''; return `<div class="vocab-card"><div class="jpword" onclick="speak('${esc(v[0])}')">${v[0]}</div><div class="zhword">${v[1]?v[1]+"｜":""}${v[2]}</div><div style="display:flex;gap:6px;margin-top:10px"><button class="secondary" onclick="speak('${esc(v[0])}')">聽</button><button class="star${saved}" onclick="toggleFav('${esc(v[0])}','${esc(v[1])}','${esc(v[2])}',this)">⭐</button></div></div>`}
function quizHtml(l){let a=l.lines.slice(0,4);return a.map(x=>`<div class="quiz" onclick="this.classList.toggle('open')"><b>${x[2]}</b><div class="answer">${x[1]} <button class="secondary" onclick="event.stopPropagation();speak('${esc(x[1])}')">🔊</button></div></div>`).join("")}
function selectLesson(id){current=id;document.querySelectorAll(".lesson").forEach(e=>e.classList.toggle("active",e.id===id));document.querySelectorAll(".tab").forEach((e,i)=>e.classList.toggle("active",lessons[i].id===id));document.getElementById("todayTip").textContent=lessons.find(l=>l.id===id).tip; window.scrollTo({top:0,behavior:"smooth"})}
function speak(text){stopSpeak(); const u=new SpeechSynthesisUtterance(text); u.lang="ja-JP"; u.rate=parseFloat(document.getElementById("rate").value); u.pitch=1.05; speechSynthesis.speak(u)}
function stopSpeak(){speechSynthesis.cancel()}
function speakCurrent(){const l=lessons.find(x=>x.id===current); let i=0; stopSpeak(); function next(){if(i>=l.lines.length)return; const u=new SpeechSynthesisUtterance(l.lines[i++][1]); u.lang="ja-JP"; u.rate=parseFloat(document.getElementById("rate").value); u.onend=()=>setTimeout(next,350); speechSynthesis.speak(u)} next()}
function toggleZh(){showZh=!showZh; document.querySelectorAll(".zh").forEach(e=>e.style.display=showZh?"block":"none")}
function randomLine(){const all=lessons.flatMap(l=>l.lines); const x=all[Math.floor(Math.random()*all.length)]; speak(x[1]); alert(x[1]+"\n\n"+x[2])}
function esc(s){return s.replaceAll("'","\\'")}

const kana = [
["あ","a"],["い","i"],["う","u"],["え","e"],["お","o"],
["か","ka"],["き","ki"],["く","ku"],["け","ke"],["こ","ko"],
["さ","sa"],["し","shi"],["す","su"],["せ","se"],["そ","so"],
["た","ta"],["ち","chi"],["つ","tsu"],["て","te"],["と","to"],
["な","na"],["に","ni"],["ぬ","nu"],["ね","ne"],["の","no"],
["は","ha"],["ひ","hi"],["ふ","fu"],["へ","he"],["ほ","ho"],
["ま","ma"],["み","mi"],["む","mu"],["め","me"],["も","mo"],
["や","ya"],["ゆ","yu"],["よ","yo"],
["ら","ra"],["り","ri"],["る","ru"],["れ","re"],["ろ","ro"],
["わ","wa"],["を","wo"],["ん","n"]
];
function showMode(id){
 document.querySelectorAll('.mode').forEach(e=>e.classList.remove('active'));
 document.getElementById(id).classList.add('active');
}
function renderKana(){
 const g=document.getElementById('kanaGrid');
 g.innerHTML=kana.map(k=>`<div class="kana-card" onclick="speak('${k[0]}')"><div class="kana-main">${k[0]}</div><div class="kana-romaji">${k[1]}</div></div>`).join('');
}
function favs(){return JSON.parse(localStorage.getItem('sunnyFavs')||'[]')}
function saveFavs(x){localStorage.setItem('sunnyFavs',JSON.stringify(x))}
function isFav(key){return favs().some(x=>x.key===key)}
function toggleFav(jp,kana,zh,btn){
 const key=jp+'|'+zh; let f=favs();
 if(isFav(key)){f=f.filter(x=>x.key!==key); btn.classList.remove('saved')}
 else{f.push({key,jp,kana,zh}); btn.classList.add('saved')}
 saveFavs(f);
}
function renderFavs(){
 const f=favs(); document.getElementById('favCount').textContent=f.length;
 document.getElementById('favList').innerHTML=f.length?f.map(v=>vocabHtml([v.jp,v.kana,v.zh])).join(''):'<p>還沒有收藏。看到想背的單字，按 ⭐ 就會出現在這裡。</p>';
}
function wrongs(){return JSON.parse(localStorage.getItem('sunnyWrongs')||'[]')}
function saveWrongs(x){localStorage.setItem('sunnyWrongs',JSON.stringify(x))}
function addWrong(v){let w=wrongs(); if(!w.some(x=>x.jp===v[0])) w.push({jp:v[0],kana:v[1],zh:v[2]}); saveWrongs(w)}
function renderWrongs(){
 const w=wrongs(); document.getElementById('wrongCount').textContent=w.length;
 document.getElementById('wrongList').innerHTML=w.length?w.map(v=>vocabHtml([v.jp,v.kana,v.zh])).join(''):'<p>目前沒有錯題。</p>';
}
function allVocab(){return lessons.flatMap(l=>l.vocab)}
let currentGame=null;
function newGame(){
 const words=allVocab(); currentGame=words[Math.floor(Math.random()*words.length)];
 document.getElementById('gameQ').textContent=currentGame[0];
 document.getElementById('gameMsg').textContent='';
 let opts=[currentGame[2]];
 while(opts.length<4){let z=words[Math.floor(Math.random()*words.length)][2]; if(!opts.includes(z)) opts.push(z)}
 opts=opts.sort(()=>Math.random()-.5);
 document.getElementById('gameOptions').innerHTML=opts.map(o=>`<button class="choice" onclick="answerGame(this,'${esc(o)}')">${o}</button>`).join('');
 speak(currentGame[0]);
}
function answerGame(btn,ans){
 document.querySelectorAll('.choice').forEach(b=>b.disabled=true);
 if(ans===currentGame[2]){btn.classList.add('ok'); document.getElementById('gameMsg').textContent='答對了！'; setTimeout(newGame,900)}
 else{btn.classList.add('bad'); addWrong(currentGame); document.getElementById('gameMsg').textContent='答錯了，正解：'+currentGame[2]+'。已加入錯題本。';}
}

renderKana();
init();
</script>
</body>
</html>
